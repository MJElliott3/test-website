# Site settings

# NB! Set your site's url, otherwise nothing will work
url: "https://mjelliott3.github.io"
baseurl: ""

# Google tracking id
google-tracking-id: "UA-XXXXXXXX-X"

#############
# HTML Head #
#############

lang: "en"
author: "Michael J. Elliott"
title: "{ Michael J. Elliott }"
description: "Blog and website of Michael Elliott, blogging mainly about security and tech topics. Opinions expressed are mine."
keywords: "elliott, michael j., personal, jekyll, theme, tech, networking"
favicon: "/img/favicon.ico"
################
# Header layout#
################
black-favicon: "/img/Icon.ico"
# background-img: "/img/bffcbb3c0a5f66158141ae3e6c89bf11-489942730.jpg"

##############################
# Dynamic Text on the Header #
##############################

quote: "Where does your curiosity end?"
# me-img: "/img/Logo - Dark Mode.png"

# To use github profile pic uncomment the following line and replace 'user_name'
# with your github user name.

me-img: "https://github.com/mjelliott3.png?size=500"

# To use gravatar profile pic uncomment the following line and replace 'email_hash'
# with your gravatar profile email hash.
# You can create the email hash by using an online tool like 'http://www.md5hashgenerator.com/'
# just enter your email and it will generate the hash.

# me-img: "https://www.gravatar.com/avatar/email_hash?s=500"

#######
# Blog #
########

post-preview-words: 96
paginate: 12
email-share: True
fb-share: False
linkedin-share: True
reddit-share: False
x-share: False
hackernews-share: False
tumblr-share: False
pinterest-share: False
pocket-share: False
vkontakte-share: False

# NB! Create an account in Cusdis and update the app id, otherwise the comments won't work
cusdis-app-id: "d34a3968-9be5-46d7-98f1-c4263cd1a220"

############
