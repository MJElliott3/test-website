# First image of the Timeline
timeline-img: "/img/fadst.png"

###########
# Contact #
###########

email: "your@email.here"

################
# Author Blurb #
################

# The author blurb goes underneath blog posts.
# This works best when your author blurb image has a transparent background, or matches your site background color.

author_blurb_image: "/img/author.png"
author_blurb:
  "I'm Michael Elliott, a dual-enrolled CS (NC State) and IT (Wake Tech) student
  based in Raleigh, NC, graduating in 2028. I hold the Cisco CCST - Networking certification
  as well as the CompTIA A+ Core 1, and currently studying for the CCNA. I spend most of 
  my free time turning curiosity into infrastructure - my current project is a Proxmox 
  homelab where I'm standing up a virtual firewall, an Active Directory domain, and a SIEM
  from the ground up. I've taught cybersecurity fundamentals, Unity, and Python professionally,
  and I'm now focused on cybersecurity and networking roles where I can keep building the same 
  way: hands-on and always curious about what's next."

##################
# Social Buttons #
##################

social:
  - icon: "github"
    url: "https://github.com/mjelliott3"
  - icon: "linkedin-in"
    url: "https://www.linkedin.com"
  - icon: "x-twitter"
    url: "https://twitter.com/"
  - icon: "rss"
    url: "https://le4ker.github.io/personal-jekyll-theme/feed.xml"

# NB! Tread carefully if you want to change the variables below this point!

# Sections shown in the index page
pages_list:
  About: "about"
  Blog: "latest-post"
  Timeline: "timeline"
  Contact: "contact"

syntax_theme: everforest

# Exclusion list from the generated _site
exclude:
  - LICENSE
  - README.md
  - CONTRIBUTING
  - CONTRIBUTORS
  - scripts
  - Dockerfile
  - docker-compose.yml
# Pagination path
paginate_path: "blog/page:num/"
# Enable minification SASS
sass:
  style: compressed
plugins:
  - jekyll-paginate
  - jekyll-spaceship
